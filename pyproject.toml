[project]
name = "agent-insights"
version = "0.1.0"
description = "Mine local coding-agent chat logs for usage, cost and interaction patterns"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[project.optional-dependencies]
nli = ["transformers>=4.44", "torch>=2.3", "sentencepiece>=0.2", "protobuf>=5"]

[project.scripts]
agent-insights = "agent_insights.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_insights"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
