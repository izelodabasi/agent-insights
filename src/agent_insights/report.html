<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --ground: #f4f6f9; --surface: #ffffff; --surface-2: #f0f2f6; --border: #e1e5ec; --border-strong: #cdd3dd;
  --text: #131720; --text-2: #4f5767; --muted: #8a92a2; --accent: #2a6fd6; --accent-soft: #e6eefb;
  --c-blue: #2a6fd6; --c-orange: #e0662f; --c-green: #1f8a3b; --c-violet: #5b4bc4; --c-red: #dc2626;
  --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --ground: #0e1015; --surface: #151820; --surface-2: #1b1f29; --border: #252a35; --border-strong: #343a47;
    --text: #e7eaf0; --text-2: #a3aab8; --muted: #6d7484; --accent: #5b95f0; --accent-soft: #1a2538;
    --c-blue: #5b95f0; --c-orange: #e8783f; --c-green: #3fa45b; --c-violet: #9a8cf0; --c-red: #ef4444;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0e1015; --surface: #151820; --surface-2: #1b1f29; --border: #252a35; --border-strong: #343a47;
  --text: #e7eaf0; --text-2: #a3aab8; --muted: #6d7484; --accent: #5b95f0; --accent-soft: #1a2538;
  --c-blue: #5b95f0; --c-orange: #e8783f; --c-green: #3fa45b; --c-violet: #9a8cf0; --c-red: #ef4444;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--text); font: 14px/1.5 var(--sans); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; }

header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); }
.titlebar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 16px 10px; }
h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.meta { font: 12px var(--mono); color: var(--muted); }
.titlebar select { margin-left: 0; }
.agent-key { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.agent-key-item { display: inline-flex; opacity: .38; transition: opacity .15s ease; }
.agent-key-item.on { opacity: 1; }
nav { display: flex; gap: 2px; overflow-x: auto; margin-bottom: -1px; }
nav button { border: 0; background: none; color: var(--text-2); padding: 8px 12px 10px; cursor: pointer;
  border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
nav button:hover { color: var(--text); }
nav button.on { color: var(--text); border-bottom-color: var(--accent); }

main { padding-block: 24px 64px; }
.tab { display: none; flex-direction: column; gap: 20px; }
.tab.on { display: flex; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; min-width: 0; overflow: hidden; }
.card > h2 { display: flex; align-items: baseline; gap: 8px; margin: 0; padding: 12px 16px;
  font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2);
  border-bottom: 1px solid var(--border); }
.card > h2 .count { font: 500 12px var(--mono); letter-spacing: 0; text-transform: none; color: var(--muted); }
.card > .body { padding: 14px 16px; }
.scroll { overflow-x: auto; }

.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 480px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { padding: 16px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); margin: 0 -1px -1px 0; }
.kpi b { display: block; font: 500 22px/1.2 var(--mono); letter-spacing: -.02em; }
.kpi span { font-size: 12px; color: var(--text-2); }

.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .bar { fill: var(--accent); }
.chart .hit { fill: transparent; }
.chart g:hover .bar { fill: var(--c-violet); }
.chart text { fill: var(--muted); font: 10px var(--mono); }
.chart .axis { stroke: var(--border-strong); }
.chart .grid { stroke: var(--border); stroke-dasharray: 2 4; }
.tip { position: absolute; pointer-events: none; background: var(--text); color: var(--surface);
  padding: 4px 8px; border-radius: 6px; font: 12px var(--mono); white-space: nowrap; display: none; z-index: 10; }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 16px; vertical-align: top; }
thead th { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  white-space: nowrap; background: var(--surface-2); cursor: pointer; user-select: none; }
thead th:hover { color: var(--text-2); }
tbody td { border-top: 1px solid var(--border); white-space: nowrap; }
tbody tr:hover td { background: var(--surface-2); }
td.n, th.n { text-align: right; }
td.n { font: 13px var(--mono); }
.arrow { color: var(--accent); }
.text, .commit, .tags { white-space: normal; }
.text { display: block; min-width: 220px; max-width: 360px; }
.nowrap { white-space: nowrap; }
.mono { font: 12.5px var(--mono); color: var(--text-2); }
.none { color: var(--muted); }
.commit { font-size: 12.5px; color: var(--text-2); max-width: 340px; position: relative; padding-left: 14px; }
.commit::before { content: ""; position: absolute; left: 2px; top: .55em; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
.commit + .commit { margin-top: 4px; }

.hbar { display: flex; align-items: center; gap: 10px; }
.hbar .fill { display: block; height: 8px; background: var(--accent); border-radius: 0 4px 4px 0; }
.hbar .v { font: 13px var(--mono); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters + .filters { margin-top: 12px; }
select, input[type=search] { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; padding: 6px 10px; }
input[type=search] { flex: 1; min-width: 180px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer;
  border: 1px solid var(--border); border-radius: 999px; padding: 3px 11px; background: var(--surface); color: var(--text-2); }
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-2);
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; margin: 0 4px 3px 0; line-height: 20px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; min-width: 260px; }
.tags .tag { margin: 0; }
.tag b { font: 500 11.5px var(--mono); color: var(--text); }
.agent-stack { display: flex; flex-wrap: wrap; gap: 5px; min-width: 120px; }
.agent-badge { --agent-color: var(--muted); display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid color-mix(in srgb, var(--agent-color) 42%, var(--border)); border-radius: 999px;
  background: color-mix(in srgb, var(--agent-color) 9%, var(--surface)); color: var(--text-2);
  padding: 2px 8px 2px 3px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.agent-mark { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%;
  background: var(--agent-color); color: white; font: 600 10px/1 var(--sans); }
.agent-count { color: var(--muted); font: 500 11px var(--mono); }
.score { display: inline-flex; align-items: center; gap: 6px; }
.spark { display: block; overflow: visible; }
.spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linejoin: round; }
.spark circle { fill: var(--accent); }
.spark .mid { stroke: var(--border); stroke-dasharray: 2 3; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 7px; color: var(--text-2); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px;
  border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); }

.msg { --agent-color: var(--muted); padding: 12px 16px 12px 13px; border-top: 1px solid var(--border);
  border-left: 3px solid var(--agent-color); }
.msg:first-child { border-top: 0; }
.msg .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-bottom: 6px; }
.msg pre { white-space: pre-wrap; word-break: break-word; margin: 0; font: 14px/1.55 var(--sans); max-width: 90ch; }
.empty { color: var(--text-2); padding: 14px 16px; margin: 0; }
#more { align-self: flex-start; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="titlebar">
      <h1>Agent Insights</h1>
      <span class="meta" id="sub"></span>
      <span class="agent-key" id="agent-key"></span>
      <select id="agent" aria-label="Agent"></select>
    </div>
    <nav id="nav">
      <button data-tab="overview">Overview</button>
      <button data-tab="projects">Projects</button>
      <button data-tab="models">Models &amp; tools</button>
      <button data-tab="sessions">Sessions</button>      <button data-tab="messages">Messages</button>
    </nav>
  </div>
</header>
<main class="wrap">
  <section class="tab" id="tab-overview">
    <div class="card kpis" id="tiles"></div>
    <div class="grid2">
      <div class="card"><h2>Prompts per day</h2><div class="body chart" id="daily"></div></div>
      <div class="card"><h2>Cost per day</h2><div class="body chart" id="daily-cost"></div></div>
    </div>
    <div class="grid2">
      <div class="card"><h2>Prompts by hour of day</h2><div class="body chart" id="hours"></div></div>
      <div class="card"><h2>Tags</h2><div class="body legend" id="legend"></div><div class="scroll"><table id="tags"></table></div></div>
    </div>
  </section>

  <section class="tab" id="tab-projects">
    <div class="card"><h2>Projects</h2><div class="scroll"><table id="projects"></table></div></div>
  </section>

  <section class="tab" id="tab-models">
    <div class="card"><h2>Models</h2><div class="scroll"><table id="models"></table></div></div>
    <div class="card"><h2>Tools</h2><div class="scroll"><table id="tools"></table></div></div>
  </section>

  <section class="tab" id="tab-sessions">
    <div class="card"><h2>Sessions <span class="count" id="session-count"></span></h2><div class="scroll"><table id="sessions"></table></div></div>
  </section>

  <section class="tab" id="tab-messages">
    <div class="card">
      <div class="body">
        <div class="filters">
          <select id="f-project" aria-label="Project"><option value="">All projects</option></select>
          <input type="search" id="f-text" placeholder="Search messages">
        </div>
        <div class="filters" id="f-tags"></div>
      </div>
    </div>
    <div class="card"><h2>Messages <span class="count" id="msg-count"></span></h2><div id="messages"></div></div>
    <button class="chip" id="more">Show more</button>
  </section>
</main>
<div class="tip" id="tip"></div>
<script>
const DATA = /*DATA*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const num = n => Number(n).toLocaleString();
const usd = n => "$" + Number(n).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const when = ts => ts.slice(0, 16).replace("T", " ");
const tok = n => n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : num(n);
const FAMILIES = [
  ["Needs attention", "--c-red", ["disliked", "rejected", "correction"]],
  ["Stopped or stuck", "--c-orange", ["interrupted", "low_performance"]],
  ["Positive outcome", "--c-green", ["approval", "committed"]],
  ["Work context", "--c-blue", ["question", "new_task", "testing", "debugging"]],
  ["Preferences", "--c-violet", ["style"]],
];
const TAG_LABELS = {
  disliked: "Disliked", rejected: "Rejected", correction: "Correction",
  interrupted: "Interrupted", low_performance: "Struggled",
  approval: "Approved", committed: "Committed", question: "Question",
  new_task: "New task", testing: "Testing", debugging: "Debugging", style: "Preference",
};
const tagLabel = t => TAG_LABELS[t] || String(t).replaceAll("_", " ");
const tagColor = t => { const f = FAMILIES.find(f => f[2].includes(t)); return f ? `var(${f[1]})` : "var(--muted)"; };
const dot = t => `<i class="dot" style="--c: ${tagColor(t)}"></i>`;
const tagList = tags => tags.map(t => `<span class="tag">${dot(t)}${esc(tagLabel(t))}</span>`).join("");
const tagCounts = t => `<div class="tags">${Object.entries(t || {}).sort((a, b) => b[1] - a[1])
  .map(([k, v]) => `<span class="tag">${dot(k)}${esc(tagLabel(k))}<b>${num(v)}</b></span>`).join("")}</div>`;
const AGENTS = {
  "claude-code": {label: "Claude Code", mark: "C", color: "var(--c-orange)"},
  codex: {label: "Codex", mark: "X", color: "var(--c-green)"},
  copilot: {label: "Copilot", mark: "P", color: "var(--c-violet)"},
};
const agentInfo = name => AGENTS[name] || {label: name, mark: String(name).slice(0, 1).toUpperCase(), color: "var(--c-blue)"};
const agentBadge = (name, count) => { const a = agentInfo(name); return `<span class="agent-badge" style="--agent-color:${a.color}" title="${esc(a.label)}${count ? ` · ${num(count)}` : ""}"><span class="agent-mark">${esc(a.mark)}</span>${esc(a.label)}${count ? `<span class="agent-count">${num(count)}</span>` : ""}</span>`; };
const agentBadges = agents => `<div class="agent-stack">${Object.entries(agents || {}).map(([name, count]) => agentBadge(name, count)).join("")}</div>`;

function showTab(name) {
  document.querySelectorAll(".tab").forEach(s => s.classList.toggle("on", s.id === `tab-${name}`));
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
}
$("nav").querySelectorAll("button").forEach(b => b.onclick = () => { location.hash = b.dataset.tab; });
const fromHash = () => showTab(["overview", "projects", "models", "sessions", "messages"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "overview");
addEventListener("hashchange", fromHash);
fromHash();

$("sub").textContent = `generated ${DATA.generated.replace("T", " ")}`;
$("agent").innerHTML = [["all", "All agents"], ...DATA.agents.map(a => [a, agentInfo(a).label])]
  .map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("");
$("legend").innerHTML = FAMILIES.map(([name, c]) =>
  `<span><i class="dot" style="--c: var(${c})"></i>${name}</span>`).join("");

let V, T;
function renderAll() {
  V = DATA.views[$("agent").value];
  T = V.totals;
  const selectedAgent = $("agent").value;
  $("agent-key").innerHTML = DATA.agents.map(a =>
    `<span class="agent-key-item${selectedAgent === "all" || selectedAgent === a ? " on" : ""}">${agentBadge(a)}</span>`
  ).join("");
  $("tiles").innerHTML = [
    [num(T.sessions), "sessions"], [num(T.projects), "projects"], [num(T.prompts), "prompts"],
    [num(T.active_hours), "active hours"], [usd(T.cost), "cost at API prices"],
    [tok(T.tokens_in), "tokens in"], [tok(T.tokens_out), "tokens out"],
    [tok(T.tokens_cached), "cache read"], [tok(T.tokens_written), "cache written"],
  ].map(([v, l]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("");
  renderCharts();
  renderTables();
  renderFilters();
  renderSessions();
  renderMessages();
}

const tip = $("tip");
function niceStep(max) {
  const raw = max / 4, mag = 10 ** Math.floor(Math.log10(raw)), n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
}
function barChart(el, rows, label, fmt, yFmt = num) {
  const W = 600, H = 190, pad = 22, left = 44, top = 8;
  const step = niceStep(Math.max(1e-9, ...rows.map(r => r.v)));
  const max = step * Math.ceil(Math.max(1e-9, ...rows.map(r => r.v)) / step);
  const plotH = H - pad - top, bw = (W - left - 4) / rows.length, gap = Math.min(2, bw * 0.2);
  const every = Math.ceil(rows.length / 8);
  let grid = "";
  for (let v = 0; v <= max + step / 2; v += step) {
    const y = H - pad - plotH * v / max;
    grid += `<line class="grid" x1="${left}" x2="${W}" y1="${y}" y2="${y}"></line><text x="${left - 6}" y="${y + 3}" text-anchor="end">${esc(yFmt(v))}</text>`;
  }
  const bars = rows.map((r, i) => {
    const h = plotH * r.v / max, x = left + 2 + i * bw, y = H - pad - h;
    const rr = Math.min(4, (bw - gap) / 2, h);
    const w = Math.max(1, bw - gap);
    const path = h > 0 ? `M${x},${H - pad} V${y + rr} Q${x},${y} ${x + rr},${y} H${x + w - rr} Q${x + w},${y} ${x + w},${y + rr} V${H - pad} Z` : "";
    const lbl = i % every === 0 ? `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${esc(label(r))}</text>` : "";
    return `<g data-i="${i}"><rect class="hit" x="${x}" y="0" width="${bw}" height="${H - pad}"></rect><path class="bar" d="${path}"></path>${lbl}</g>`;
  }).join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">${grid}<line class="axis" x1="${left}" x2="${W}" y1="${H - pad}" y2="${H - pad}"></line>${bars}</svg>`;
  el.querySelectorAll("g").forEach(g => {
    g.addEventListener("mousemove", ev => {
      tip.textContent = fmt(rows[g.dataset.i]);
      tip.style.display = "block";
      tip.style.left = (ev.clientX + 12 + scrollX) + "px";
      tip.style.top = (ev.clientY - 30 + scrollY) + "px";
    });
    g.addEventListener("mouseleave", () => tip.style.display = "none");
  });
}
function renderCharts() {
  barChart($("daily"), V.daily.map(d => ({v: d.prompts, d})), r => r.d.date.slice(5),
    r => `${r.d.date} · ${num(r.d.prompts)} prompts`);
  barChart($("daily-cost"), V.daily.map(d => ({v: d.cost, d})), r => r.d.date.slice(5),
    r => `${r.d.date} · ${usd(r.d.cost)}`, v => "$" + num(v));
  barChart($("hours"), V.hours.map((v, h) => ({v, h})), r => String(r.h).padStart(2, "0"),
    r => `${String(r.h).padStart(2, "0")}:00 · ${num(r.v)} prompts`);
}

function sparkline(values) {
  if (!values || values.length < 2) return `<span class="none">–</span>`;
  const W = 120, H = 24, x = i => 1 + i * (W - 2) / (values.length - 1), y = v => H - 2 - (H - 4) * v / 100;
  const pts = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const last = values[values.length - 1];
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Score trend, ends at ${last}">` +
    `<line x1="0" x2="${W}" y1="${y(50)}" y2="${y(50)}" class="mid"></line>` +
    `<polyline points="${pts}"></polyline><circle cx="${x(values.length - 1)}" cy="${y(last)}" r="2.5"></circle></svg>`;
}
const scoreCell = v => v === null ? `<span class="none">–</span>`
  : `<span class="score"><i class="dot" style="--c: var(${v >= 80 ? "--c-green" : v >= 50 ? "--c-orange" : "--c-red"})"></i>${v}</span>`;

const cellText = v => Array.isArray(v) ? v.join(" ") : v && typeof v === "object" ? Object.keys(v).join(" ") : String(v ?? "");
function table(el, cols, rows, onCount) {
  let key = null, dir = -1;
  el.innerHTML = `<thead><tr>${cols.map(c => `<th class="${c.n ? "n" : ""}" data-k="${c.k}">${c.h}<span class="arrow"></span></th>`).join("")}</tr></thead><tbody></tbody>`;
  const body = el.querySelector("tbody");
  const draw = () => {
    const shown = [...rows];
    if (key !== null) shown.sort((a, b) => {
      const x = a[key], y = b[key];
      return (typeof x === "number" ? x - y : cellText(x).localeCompare(cellText(y))) * dir;
    });
    body.innerHTML = shown.map(r => `<tr>${cols.map(c => `<td class="${c.n ? "n" : ""}">${c.f ? c.f(r[c.k], r) : esc(r[c.k])}</td>`).join("")}</tr>`).join("") ||
      `<tr><td class="none" colspan="${cols.length}">No rows match.</td></tr>`;
    el.querySelectorAll("thead tr:first-child th").forEach(th =>
      th.querySelector(".arrow").textContent = th.dataset.k === key ? (dir > 0 ? " ▲" : " ▼") : "");
    onCount?.(shown.length);
  };
  el.querySelectorAll("thead tr:first-child th").forEach(th => th.onclick = () => {
    dir = key === th.dataset.k ? -dir : -1;
    key = th.dataset.k;
    draw();
  });
  draw();
}

function renderTables() {
  const tagMax = Math.max(1, ...Object.values(T.tags));
  table($("tags"), [
    {k: "tag", h: "Tag", f: v => `<span class="hbar">${dot(v)}${esc(tagLabel(v))}</span>`},
    {k: "count", h: "Count", f: v => `<div class="hbar"><i class="fill" style="width:${Math.round(160 * v / tagMax)}px"></i><span class="v">${num(v)}</span></div>`},
  ], Object.entries(T.tags).map(([tag, count]) => ({tag, count})).sort((a, b) => b.count - a.count),
  );

  table($("projects"), [
    {k: "name", h: "Project"}, {k: "agents", h: "Agents", f: agentBadges},
    {k: "score", h: "Score", n: 1, f: scoreCell},
    {k: "turns", h: "Turns", n: 1, f: num}, {k: "bad_turns", h: "Bad turns", n: 1, f: num},
    {k: "sessions", h: "Sessions", n: 1, f: num}, {k: "prompts", h: "Prompts", n: 1, f: num},
    {k: "tool_calls", h: "Tool calls", n: 1, f: num}, {k: "tool_errors", h: "Failed tool calls", n: 1, f: num},
    {k: "active_hours", h: "Active hours", n: 1}, {k: "cost", h: "Cost", n: 1, f: usd},
    {k: "median_prompt_len", h: "Median message length (chars)", n: 1, f: num},
    {k: "first", h: "First", f: v => `<span class="mono">${esc(v)}</span>`},
    {k: "last", h: "Last", f: v => `<span class="mono">${esc(v)}</span>`},
    {k: "tags", h: "Tags", f: tagCounts},
  ], V.projects);

  table($("models"), [
    {k: "model", h: "Model", f: v => `<span class="mono">${esc(v)}</span>`},
    {k: "agents", h: "Agents", f: agentBadges},
    {k: "input", h: "Input", n: 1, f: num}, {k: "output", h: "Output", n: 1, f: num},
    {k: "cache_read", h: "Cache read", n: 1, f: num}, {k: "cache_write", h: "Cache write", n: 1, f: num},
    {k: "cost", h: "Cost", n: 1, f: (v, r) => r.priced ? usd(v) : "unpriced"},
  ], V.models);

  table($("tools"), [
    {k: "tool", h: "Tool", f: v => `<span class="mono">${esc(v)}</span>`},
    {k: "agents", h: "Agents", f: agentBadges},
    {k: "calls", h: "Calls", n: 1, f: v => num(v || 0)},
    {k: "errors", h: "Failed", n: 1, f: v => num(v || 0)}, {k: "rejections", h: "Rejected by you", n: 1, f: v => num(v || 0)},
  ], V.tools);
}

function renderSessions() {
  table($("sessions"), [
    {k: "start", h: "Start", f: v => `<span class="mono">${when(v)}</span>`},
    {k: "end", h: "End", f: v => `<span class="mono">${when(v)}</span>`},
    {k: "name", h: "Name", f: v => v ? `<span class="text">${esc(v)}</span>` : `<span class="none">untitled</span>`},
    {k: "agent", h: "Agent", f: agentBadge}, {k: "project", h: "Project"}, {k: "prompts", h: "Prompts", n: 1, f: num},
    {k: "active_min", h: "Active minutes", n: 1, f: num}, {k: "cost", h: "Cost", n: 1, f: usd},
    {k: "score", h: "Score", n: 1, f: scoreCell},
    {k: "trend", h: "Score trend", f: sparkline},
    {k: "cost_per_call", h: "Cost per call", n: 1, f: v => "$" + v.toFixed(3)},
    {k: "files_edited", h: "Files edited", n: 1, f: num},
    {k: "commits", h: "Commits", f: v => v.map(c => `<div class="commit">${esc(c)}</div>`).join("") || `<span class="none">none</span>`},
    {k: "tags", h: "Tags", f: v => `<div class="tags">${tagList(v)}</div>`},
  ], V.sessions, n => $("session-count").textContent = num(n));
}

const active = new Set();
let limit = 100;
function renderFilters() {
  const projects = [...new Set(V.sessions.map(s => s.project))].sort();
  const keep = $("f-project").value;
  $("f-project").innerHTML = `<option value="">All projects</option>` +
    projects.map(p => `<option${p === keep ? " selected" : ""}>${esc(p)}</option>`).join("");
  $("f-tags").innerHTML = Object.keys(T.tags).sort().map(t =>
    `<button class="chip${active.has(t) ? " on" : ""}" data-t="${esc(t)}">${dot(t)}${esc(tagLabel(t))}</button>`).join("");
  $("f-tags").querySelectorAll(".chip").forEach(b => b.onclick = () => {
    active.has(b.dataset.t) ? active.delete(b.dataset.t) : active.add(b.dataset.t);
    b.classList.toggle("on");
    limit = 100;
    renderMessages();
  });
}
function renderMessages() {
  const p = $("f-project").value, q = $("f-text").value.toLowerCase();
  const rows = V.messages.filter(m =>
    (!p || m.project === p) && (!q || m.text.toLowerCase().includes(q)) &&
    [...active].every(t => m.tags.includes(t)));
  $("msg-count").textContent = num(rows.length);
  $("messages").innerHTML = rows.slice(0, limit).map(m => {
    const agent = agentInfo(m.agent);
    return `<div class="msg" style="--agent-color:${agent.color}"><div class="meta">${agentBadge(m.agent)}<span>${esc(when(m.ts))}</span><span>${esc(m.project)}</span>${m.kind === "rejection" ? "<span>rejection reason</span>" : ""}<span>${tok(m.tokens_out)} tokens out · ${usd(m.cost)}</span>${tagList(m.tags)}</div><pre>${esc(m.text)}</pre></div>`;
  }).join("") || `<p class="empty">No messages match.</p>`;
  $("more").hidden = rows.length <= limit;
  $("more").textContent = `Show more · ${num(rows.length - limit)} left`;
}
$("f-project").onchange = $("f-text").oninput = () => { limit = 100; renderMessages(); };
$("more").onclick = () => { limit += 100; renderMessages(); };
$("agent").onchange = renderAll;
renderAll();
</script>
</body>
</html>
